<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Whereabouts Kiosk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Boot page for the Whereabouts kiosks: choose one of the partner kiosk experiences.">
  <style>
    /* Gabarito (SIL Open Font License) is served from this repo so the page
       makes no third-party requests. Variable font: one file covers 400–900. */
    @font-face {
      font-family: "Gabarito";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url("fonts/gabarito-latin.woff2") format("woff2");
    }

    /* Designed on a 1080×1920 portrait stage, like the partner kiosk pages.
       The stage scales to fill any 9:16 screen; 1 design px = 1 * var(--px). */
    :root {
      --ink: #121318;
      --ink-soft: #5C5F6B;
      --paper: #F4F2EC;
      --card: #FFFFFF;
      --line: #D9D6CC;
      --accent: #121318;
      --font: "Gabarito", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: var(--font);
      color: var(--ink);
    }
    /* Kiosk mode (open with ?kiosk): hide the mouse cursor on the touchscreen. */
    html.kiosk, html.kiosk * { cursor: none !important; }
    body { display: grid; place-items: center; }

    .stage {
      width: min(100vw, calc(100vh * 9 / 16));
      aspect-ratio: 9 / 16;
      container-type: inline-size;
      background: var(--paper);
      overflow: hidden;
      position: relative;
    }
    .frame {
      --px: calc(100cqw / 1080);
      position: absolute; inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: calc(96 * var(--px)) calc(72 * var(--px)) calc(64 * var(--px));
      gap: calc(56 * var(--px));
    }

    /* Header */
    .head { display: grid; gap: calc(20 * var(--px)); }
    .brand {
      display: inline-flex; align-items: center; gap: calc(16 * var(--px));
      font-weight: 700; font-size: calc(30 * var(--px)); letter-spacing: 0.02em;
      text-transform: uppercase; color: var(--ink-soft);
    }
    .brand::before {
      content: ""; width: calc(16 * var(--px)); height: calc(16 * var(--px));
      border-radius: 50%; background: var(--ink);
    }
    h1 {
      font-weight: 800; font-size: calc(84 * var(--px)); line-height: 1.02;
      letter-spacing: -0.02em; color: var(--ink); text-wrap: balance;
    }
    .lede { font-size: calc(34 * var(--px)); font-weight: 500; color: var(--ink-soft); }

    /* Buttons */
    .menu { list-style: none; display: grid; grid-auto-rows: 1fr; gap: calc(24 * var(--px)); min-height: 0; }
    .tile {
      display: grid; grid-template-columns: calc(14 * var(--px)) 1fr auto; align-items: center;
      gap: calc(40 * var(--px));
      height: 100%; width: 100%;
      padding: 0 calc(48 * var(--px)) 0 0;
      background: var(--card);
      border: calc(2 * var(--px)) solid var(--line);
      border-radius: calc(28 * var(--px));
      text-decoration: none; color: var(--ink);
      box-shadow: 0 calc(10 * var(--px)) calc(30 * var(--px)) rgba(18, 19, 24, 0.06);
      overflow: hidden;
      transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    }
    .tile:active { transform: scale(0.985); box-shadow: 0 calc(4 * var(--px)) calc(12 * var(--px)) rgba(18, 19, 24, 0.10); }
    .tile:focus-visible { outline: calc(5 * var(--px)) solid var(--accent); outline-offset: calc(4 * var(--px)); }
    .tile .bar { align-self: stretch; background: var(--accent); }
    .tile .text { display: grid; gap: calc(8 * var(--px)); min-width: 0; }
    .tile .name { font-weight: 700; font-size: calc(52 * var(--px)); line-height: 1.1; letter-spacing: -0.01em; }
    .tile .sub  { font-weight: 500; font-size: calc(28 * var(--px)); color: var(--ink-soft); }
    .tile .go {
      width: calc(96 * var(--px)); height: calc(96 * var(--px)); border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent); color: #fff;
    }
    .tile .go svg { width: calc(44 * var(--px)); height: calc(44 * var(--px)); }

    /* Placeholder slot: visible until a URL is set in the KIOSKS list below. */
    .tile.placeholder {
      background: transparent; box-shadow: none;
      border: calc(3 * var(--px)) dashed #BDBDBD; color: var(--ink-soft);
      pointer-events: none;
    }
    .tile.placeholder .bar { background: #BDBDBD; }
    .tile.placeholder .go { background: #BDBDBD; }

    /* Footer */
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      font-size: calc(24 * var(--px)); font-weight: 500; color: var(--ink-soft);
      padding-top: calc(32 * var(--px)); border-top: calc(2 * var(--px)) solid var(--line);
    }
    @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame">
      <header class="head">
        <div class="brand">Whereabouts</div>
        <h1>Choose a kiosk experience</h1>
        <p class="lede">Tap a partner below to begin.</p>
      </header>

      <ul class="menu" id="menu"></ul>

      <footer class="foot">
        <span>Ontario Tourism Summit 2027</span>
        <span>Powered by Whereabouts</span>
      </footer>
    </div>
  </main>

  <script>
    // ----- Edit this list to change the buttons. -------------------------
    // Set `url` to make a slot live. A slot with no url renders as a dashed
    // placeholder and is not tappable.
    const KIOSKS = [
      { name: "Destination Markham",        sub: "Discover Markham",                     accent: "#E61C38", url: "https://tnb3000.github.io/DMC-TIAO/" },
      { name: "Native Experiences Ontario", sub: "Plan a trip with Indigenous hosts",    accent: "#5B3A1E", url: "https://nativeexperiencesontario.ca/kiosk" },
      { name: "myBlueprint",                sub: "myBlueprint × TIAO",                   accent: "#0092FF", url: "https://tnb3000.github.io/my-blueprint/" },
      { name: "Ontario Corps",              sub: "Ontario Corps kiosk",                  accent: "#0C1440", url: "https://tnb3000.github.io/ontario-corps/" },
      // Pages URL for TNB3000/whereabouts-kiosk once it is published from main (repo is empty as of 2026-10-16).
      { name: "Whereabouts",                sub: "See the Whereabouts platform",         accent: "#FF6D3F", url: "https://tnb3000.github.io/whereabouts-kiosk/" },
    ];
    // --------------------------------------------------------------------

    const params = new URLSearchParams(location.search);
    const kiosk = params.has("kiosk");
    if (kiosk) document.documentElement.classList.add("kiosk");

    // Carry ?kiosk through to pages that understand it (the GitHub Pages kiosks).
    function href(url) {
      if (!kiosk) return url;
      try {
        const u = new URL(url);
        if (u.hostname.endsWith("github.io")) u.search = "?kiosk";
        return u.toString();
      } catch (e) { return url; }
    }

    const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
    const menu = document.getElementById("menu");
    for (const k of KIOSKS) {
      const li = document.createElement("li");
      const live = Boolean(k.url);
      const el = document.createElement(live ? "a" : "div");
      el.className = "tile" + (live ? "" : " placeholder");
      el.style.setProperty("--accent", k.accent);
      if (live) { el.href = href(k.url); el.setAttribute("aria-label", "Open " + k.name); }
      else { el.setAttribute("aria-hidden", "true"); }
      el.innerHTML = '<span class="bar"></span>' +
        '<span class="text"><span class="name"></span><span class="sub"></span></span>' +
        '<span class="go">' + arrow + '</span>';
      el.querySelector(".name").textContent = k.name;
      el.querySelector(".sub").textContent = k.sub;
      li.appendChild(el);
      menu.appendChild(li);
    }

    // Kiosk hygiene: no context menu on long-press, no pinch zoom.
    addEventListener("contextmenu", function (e) { e.preventDefault(); });
    addEventListener("gesturestart", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
